<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Feelings check-in</title>
<style>
  :root {
    --bg: #1B2321;
    --surface: #232C29;
    --border: #2E3A35;
    --border-strong: #3C4A44;
    --text: #EDEAE1;
    --muted: #9BA79E;
    --faint: #6B7671;
    --accent: #C97B84;
    --danger: #C2564B;
    --good: #7FA084;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% -10%, #1F2C29, #0F1513 70%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .card { width: 100%; max-width: 420px; background: var(--bg); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
  .header { display: flex; justify-content: space-between; align-items: flex-start; padding: 20px 20px 16px; border-bottom: 1px solid var(--border); }
  .header .date { font-size: 12px; color: var(--muted); letter-spacing: 0.02em; }
  .header h1 { font-family: Georgia, serif; font-weight: 400; font-size: 18px; margin: 4px 0 0; }
  .streak { text-align: right; }
  .streak .num { font-size: 18px; color: var(--accent); line-height: 1; }
  .streak .label { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .body { padding: 20px; min-height: 300px; }
  .hint { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .core-btn { border: none; border-radius: 12px; padding: 16px; text-align: left; font-size: 14px; cursor: pointer; }
  .pill { border-radius: 999px; padding: 7px 14px; font-size: 14px; background: var(--surface); border: 1px solid var(--border-strong); color: var(--text); cursor: pointer; }
  .pillwrap { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .crumbs { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-bottom: 12px; flex-wrap: wrap; }
  .crumbs button { background: none; border: none; color: var(--accent); font-size: 12px; cursor: pointer; padding: 0; }
  .link-btn { background: none; border: none; color: var(--muted); font-size: 12px; text-decoration: underline; cursor: pointer; padding: 0; }
  .saved { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 32px 0; }
  .checkmark { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; font-size: 22px; }
  .saved .small { font-size: 13px; color: var(--muted); }
  .saved .path { font-family: Georgia, serif; font-size: 18px; margin-top: 4px; }
  .again-btn { margin-top: 24px; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--border-strong); background: none; color: var(--text); font-size: 13px; cursor: pointer; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr 1fr; border-top: 1px solid var(--border); }
  .tab { padding: 12px; font-size: 14px; text-align: center; border: none; cursor: pointer; background: transparent; color: var(--faint); }
  .tab.active { background: var(--surface); color: var(--text); }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 56px; margin-bottom: 24px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; }
  .bar { width: 100%; border-radius: 3px; }
  .bar-count { font-size: 10px; color: var(--muted); }
  .day-label { font-size: 12px; color: var(--muted); margin: 0 0 6px; }
  .entry-row { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border-radius: 10px; padding: 8px 12px; margin-bottom: 6px; }
  .entry-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .dot { width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0; }
  .entry-text { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; padding-left: 8px; }
  .entry-time { font-size: 11px; color: var(--muted); }
  .del-btn { background: none; border: none; color: var(--faint); cursor: pointer; font-size: 12px; }
  .empty { font-size: 13px; color: var(--muted); text-align: center; padding: 40px 0; }
  .history-scroll { max-height: 460px; overflow-y: auto; padding-right: 2px; }
  .error { font-size: 12px; color: var(--danger); margin-top: 12px; }
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
  .stat-card { background: var(--surface); border-radius: 8px; padding: 10px 6px; text-align: center; }
  .stat-val { font-size: 16px; color: var(--accent); line-height: 1; }
  .stat-label { font-size: 10px; color: var(--muted); margin-top: 6px; line-height: 1.2; }
  .win-row { display: flex; gap: 6px; margin-bottom: 16px; }
  .win-btn { padding: 4px 10px; border-radius: 999px; font-size: 12px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--muted); cursor: pointer; }
  .win-btn.active { background: var(--accent); color: #2A1518; }
  .dist-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .dist-label { font-size: 12px; width: 64px; flex-shrink: 0; }
  .dist-track { flex: 1; background: var(--surface); border-radius: 999px; height: 8px; overflow: hidden; }
  .dist-fill { height: 100%; }
  .dist-num { font-size: 12px; color: var(--muted); width: 56px; text-align: right; flex-shrink: 0; }
  .highlight-card { background: var(--surface); border-radius: 8px; padding: 10px 12px; margin-bottom: 20px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .word-row { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-bottom: 4px; }
  .word-row .dot { width: 6px; height: 6px; }
  .word-row span:nth-child(2) { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .word-row span:nth-child(3) { color: var(--faint); }
  .wow-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; padding: 4px 0; }
  .wow-row .left { display: flex; align-items: center; gap: 6px; }

  .steps { display: flex; gap: 4px; margin-bottom: 14px; }
  .steps span { flex: 1; height: 3px; border-radius: 3px; background: var(--border-strong); }
  .steps span.on { background: var(--accent); }
  .step-kicker { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin: 0 0 4px; }
  .step-title { font-family: Georgia, serif; font-size: 17px; font-weight: 400; margin: 0 0 14px; }
  .field-label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 6px; }
  textarea, input[type=text] { width: 100%; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 10px; color: var(--text); font: inherit; font-size: 14px; padding: 10px 12px; }
  textarea { min-height: 84px; resize: vertical; line-height: 1.4; }
  textarea:focus, input[type=text]:focus { outline: none; border-color: var(--accent); }
  textarea::placeholder, input::placeholder { color: var(--faint); }
  .chipwrap { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border-radius: 999px; padding: 5px 11px; font-size: 13px; background: var(--surface); border: 1px solid var(--border-strong); color: var(--text); cursor: pointer; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #2A1518; }
  .chip-input { margin-top: 6px; padding: 7px 12px !important; font-size: 13px !important; }
  .nav-row { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
  .btn-primary { padding: 9px 18px; border-radius: 999px; border: none; background: var(--accent); color: #2A1518; font-size: 14px; cursor: pointer; }
  .btn-ghost { padding: 9px 16px; border-radius: 999px; border: 1px solid var(--border-strong); background: none; color: var(--text); font-size: 14px; cursor: pointer; }
  .chosen { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-radius: 12px; padding: 12px 14px; font-size: 15px; }
  .chosen button { background: none; border: none; font-size: 12px; text-decoration: underline; cursor: pointer; color: inherit; opacity: 0.8; padding: 0; }
  .intensity-row { display: flex; align-items: center; gap: 12px; }
  .intensity-row input[type=range] { flex: 1; accent-color: var(--accent); }
  .intensity-val { font-size: 18px; color: var(--accent); width: 52px; text-align: right; }
  .intensity-ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--faint); margin-top: 2px; padding-right: 64px; }
  .reflect { padding: 8px 0; }
  .reflect-quote { font-family: Georgia, serif; font-size: 18px; line-height: 1.5; margin: 0 0 20px; }
  .reflect-quote .fw { border-bottom: 2px solid; padding-bottom: 1px; }
  .reflect-quote .int { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; color: var(--muted); }
  .reflect-ask { font-size: 14px; color: var(--muted); margin: 0 0 10px; }
  .reflect-btns { display: flex; flex-wrap: wrap; gap: 8px; }
  .abc { background: var(--surface); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .abc-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .abc-row { display: grid; grid-template-columns: 18px 1fr; gap: 8px; font-size: 13px; line-height: 1.4; padding: 3px 0; }
  .abc-row + .abc-row { border-top: 1px dashed var(--border-strong); margin-top: 3px; padding-top: 6px; }
  .abc-key { font-size: 11px; color: var(--faint); font-weight: 600; padding-top: 1px; }
  .abc-key .dot { display: inline-block; margin-top: 5px; }
  .abc-text { overflow-wrap: anywhere; }
  .abc-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .after-pill { display: inline-block; font-size: 11px; border-radius: 999px; padding: 1px 8px; border: 1px solid var(--border-strong); color: var(--muted); }
  .after-pill.better { color: var(--good); border-color: var(--good); }
  .after-pill.worse { color: var(--danger); border-color: var(--danger); }
  .del-btn.confirm { color: var(--danger); }
  .hist-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .hist-head .day-label { margin: 0; }
  .copy-btn { padding: 4px 10px; border-radius: 999px; font-size: 12px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); cursor: pointer; }
  .section-title { font-family: Georgia, serif; font-size: 15px; margin: 24px 0 4px; }
  .section-note { font-size: 12px; color: var(--faint); margin: 0 0 10px; }
  .pat-row { background: var(--surface); border-radius: 8px; padding: 8px 12px; margin-bottom: 6px; }
  .pat-head { display: flex; justify-content: space-between; font-size: 13px; gap: 8px; }
  .pat-head span:first-child { overflow-wrap: anywhere; }
  .pat-head .n { color: var(--faint); flex-shrink: 0; }
  .pat-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .pat-sub .dot { display: inline-block; width: 6px; height: 6px; margin-right: 4px; vertical-align: middle; }
  .stack { display: flex; height: 6px; border-radius: 999px; overflow: hidden; margin-top: 6px; background: var(--bg); gap: 1px; }
  .stack div { height: 100%; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div>
      <p class="date" id="todayDate"></p>
      <h1>How are you, really?</h1>
    </div>
    <div class="streak" id="streakBox"></div>
  </div>
  <div class="body" id="bodyEl"></div>
  <div class="tabs">
    <button class="tab active" id="tabCheckin">Check in</button>
    <button class="tab" id="tabHistory">History</button>
    <button class="tab" id="tabInsights">Insights</button>
  </div>
</div>

<script>
const WHEEL = [
  { key: "happy", label: "Happy", color: "#E8C547", text: "#4A3D0A",
    middles: { Playful: ["Aroused","Cheeky"], Content: ["Free","Joyful"], Interested: ["Curious","Inquisitive"],
      Proud: ["Successful","Confident"], Accepted: ["Respected","Valued"], Powerful: ["Courageous","Creative"],
      Peaceful: ["Loving","Thankful"], Trusting: ["Sensitive","Intimate"], Optimistic: ["Hopeful","Inspired"] } },
  { key: "surprised", label: "Surprised", color: "#9B87B0", text: "#2E2438",
    middles: { Startled: ["Shocked","Dismayed"], Confused: ["Disillusioned","Perplexed"], Amazed: ["Astonished","Awe"], Excited: ["Eager","Energetic"] } },
  { key: "bad", label: "Bad", color: "#7FA084", text: "#1F2E22",
    middles: { Bored: ["Indifferent","Apathetic"], Busy: ["Pressured","Rushed"], Stressed: ["Overwhelmed","Out of control"], Tired: ["Sleepy","Unfocused"] } },
  { key: "fearful", label: "Fearful", color: "#D4A574", text: "#3D2B12",
    middles: { Scared: ["Helpless","Frightened"], Anxious: ["Overwhelmed","Worried"], Insecure: ["Inadequate","Inferior"],
      Weak: ["Worthless","Insignificant"], Rejected: ["Excluded","Persecuted"], Threatened: ["Nervous","Exposed"] } },
  { key: "angry", label: "Angry", color: "#C2564B", text: "#3A0E09",
    middles: { "Let down": ["Betrayed","Resentful"], Humiliated: ["Disrespected","Ridiculed"], Bitter: ["Indignant","Violated"],
      Mad: ["Furious","Jealous"], Aggressive: ["Provoked","Hostile"], Frustrated: ["Infuriated","Annoyed"],
      Distant: ["Withdrawn","Numb"], Critical: ["Sceptical","Dismissive"] } },
  { key: "disgusted", label: "Disgusted", color: "#7C8570", text: "#22261D",
    middles: { Disapproving: ["Judgemental","Embarrassed"], Disappointed: ["Appalled","Revolted"], Awful: ["Nauseated","Detestable"], Repelled: ["Horrified","Hesitant"] } },
  { key: "sad", label: "Sad", color: "#5B84B1", text: "#0F2338",
    middles: { Lonely: ["Isolated","Abandoned"], Vulnerable: ["Victimised","Fragile"], Despair: ["Grief","Powerless"],
      Guilty: ["Ashamed","Remorseful"], Depressed: ["Empty","Inferior"], Hurt: ["Disappointed","Embarrassed"] } },
];
const UNSURE = { key: "unlabeled", label: "Not sure", color: "#5F5E5A", text: "#F1EFE8" };
const WHO = ["Alone", "Partner", "Family", "Friends", "Colleagues", "Strangers"];
const WHERE = ["Home", "Work", "School", "Outside", "Online", "In transit"];
const DID = ["Spoke up", "Stayed quiet", "Withdrew", "Argued", "Asked for help", "Distracted myself", "Cried", "Took a break", "Carried on"];
const AFTER = [ { key: "better", label: "Better" }, { key: "same", label: "About the same" }, { key: "worse", label: "Worse" } ];
const STEP_TITLES = [
  ["Antecedent", "What happened just before?"],
  ["Feeling", "What did you feel?"],
  ["Behaviour", "What did you do or say?"],
  ["Consequence", "What happened next?"],
];

const STORAGE_KEY = "feelings-checkin-entries";
const WINDOWS = [ { label: "7d", days: 7 }, { label: "30d", days: 30 }, { label: "90d", days: 90 }, { label: "All", days: null } ];

let entries = [];
try { entries = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); } catch (e) { entries = []; }
if (!Array.isArray(entries)) entries = [];

function newDraft() {
  return { what: "", who: [], whoOther: "", where: "", whereOther: "", feeling: null, intensity: 5,
           did: "", didTags: [], next: "", after: null };
}

let tab = "checkin";
let phase = "flow";            // flow | reflect | correct | done
let step = 0;                  // 0..3 within the flow
let draft = newDraft();
let pick = { core: null, middle: null };      // wheel position while choosing
let currentId = null;          // entry being reflected back
let retried = false;
let pendingDelete = null;
let saveError = false;
let windowDays = 30;

function persist() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); saveError = false; }
  catch (e) { saveError = true; }
}

function dayKey(iso) { return new Date(iso).toDateString(); }

function computeStreak() {
  if (entries.length === 0) return 0;
  const days = new Set(entries.map(e => dayKey(e.date)));
  let streak = 0;
  let cursor = new Date();
  if (!days.has(cursor.toDateString())) {
    cursor.setDate(cursor.getDate() - 1);
    if (!days.has(cursor.toDateString())) return 0;
  }
  while (days.has(cursor.toDateString())) { streak += 1; cursor.setDate(cursor.getDate() - 1); }
  return streak;
}

function computeLongestStreak() {
  if (entries.length === 0) return 0;
  const daySet = new Set(entries.map(e => new Date(e.date).setHours(0,0,0,0)));
  const days = Array.from(daySet).sort((a,b) => a-b);
  let longest = 1, current = 1;
  for (let i = 1; i < days.length; i++) {
    if (Math.round((days[i] - days[i-1]) / 86400000) === 1) { current += 1; longest = Math.max(longest, current); }
    else current = 1;
  }
  return longest;
}

function windowFilter(days) {
  if (days === null) return entries;
  const cutoff = Date.now() - days * 24 * 60 * 60 * 1000;
  return entries.filter(e => new Date(e.date).getTime() >= cutoff);
}

function topCounts(arr, field, n) {
  const counts = new Map();
  arr.forEach(e => {
    const v = e[field];
    if (!v) return;
    if (!counts.has(v)) counts.set(v, { label: v, count: 0, color: e.color });
    counts.get(v).count += 1;
  });
  return Array.from(counts.values()).sort((a,b) => b.count - a.count).slice(0, n);
}

function pathLabel(e) { return [e.coreLabel, e.middle, e.outer].filter(Boolean).join(" · "); }

function mostCommonPath(arr) {
  const counts = new Map();
  arr.forEach(e => {
    const label = pathLabel(e);
    if (!counts.has(label)) counts.set(label, { label, count: 0 });
    counts.get(label).count += 1;
  });
  const list = Array.from(counts.values()).sort((a,b) => b.count - a.count);
  return list[0] || null;
}

function fmtDate(iso) { return new Date(iso).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }); }
function fmtTime(iso) { return new Date(iso).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }); }

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function feelingFrom(coreData, middleLabel, outerLabel) {
  return { coreKey: coreData.key, coreLabel: coreData.label, color: coreData.color, textColor: coreData.text,
           middle: middleLabel || null, outer: outerLabel || null };
}

function currentEntry() { return entries.find(e => e.id === currentId) || null; }

/* ---------- reflection of feelings ---------- */

const LOWER_STARTS = new Set(("you your you're yours yourself the a an we our it there this that these those he she they his her their " +
  "someone somebody nobody nothing everyone when while after before during at in on with got had was went having being getting " +
  "woke saw heard read received found lost missed forgot tried").split(" "));

// Turn her first-person words into second person so they can be said back to her.
function reflectText(s, alwaysLower) {
  let t = (s || "").trim().replace(/\s+/g, " ").replace(/[.!?,;:\s]+$/, "");
  if (!t) return "";
  [
    [/\bI['’]m\b/gi, "you're"], [/\bI am\b/gi, "you are"], [/\bI was\b/gi, "you were"],
    [/\bI['’]ve\b/gi, "you've"], [/\bI['’]d\b/gi, "you'd"], [/\bI['’]ll\b/gi, "you'll"],
    [/\bmyself\b/gi, "yourself"], [/\bmine\b/gi, "yours"], [/\bmy\b/gi, "your"],
    [/\bme\b/gi, "you"], [/\bI\b/gi, "you"],
  ].forEach(([re, to]) => { t = t.replace(re, to); });
  const first = t.split(" ")[0].toLowerCase();
  if (alwaysLower || LOWER_STARTS.has(first)) t = t.charAt(0).toLowerCase() + t.slice(1);
  return t;
}

function feelWord(e) {
  if (e.coreKey === "unlabeled") return null;
  return (e.outer || e.middle || e.coreLabel || "").toLowerCase();
}

function reflectionHtml(e) {
  const word = feelWord(e);
  let s = word
    ? 'You felt <span class="fw" style="border-color:' + e.color + '">' + escapeHtml(word) + '</span>' +
      (e.intensity ? ' <span class="int">(' + e.intensity + '/10)</span>' : '')
    : 'You weren’t sure what you felt';
  const a = reflectText(e.antecedent && e.antecedent.what, false);
  const b = reflectText(e.behaviour && e.behaviour.what, true);
  if (a) s += ' when ' + escapeHtml(a);
  if (b) s += (a ? ', and ' : ' and ') + (/^you\b/i.test(b) ? '' : 'you ') + escapeHtml(b);
  return s + '.';
}

/* ---------- saving ---------- */

function saveEntry() {
  const d = draft;
  const who = d.who.slice();
  if (d.whoOther.trim()) who.push(d.whoOther.trim());
  const entry = Object.assign({
    id: Date.now() + "-" + Math.random().toString(36).slice(2, 7),
    date: new Date().toISOString(),
  }, d.feeling, {
    intensity: d.feeling.coreKey === "unlabeled" ? null : d.intensity,
    antecedent: { what: d.what.trim(), who: who, where: d.whereOther.trim() || d.where || null },
    behaviour: { what: d.did.trim(), tags: d.didTags.slice() },
    consequence: { what: d.next.trim(), after: d.after },
    reflection: { fits: null, corrections: 0, first: null },
  });
  entries.unshift(entry);
  persist();
  currentId = entry.id; phase = "reflect"; retried = false;
  draft = newDraft(); step = 0; pick = { core: null, middle: null };
  render();
}

function deleteEntry(id) { entries = entries.filter(e => e.id !== id); pendingDelete = null; persist(); render(); }

/* ---------- header ---------- */

function renderHeader() {
  document.getElementById("todayDate").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
  const streak = computeStreak();
  document.getElementById("streakBox").innerHTML = streak > 0
    ? '<div class="num">' + streak + '</div><div class="label">day' + (streak === 1 ? "" : "s") + ' in a row</div>' : "";
}

/* ---------- feeling wheel (used for the check-in and for correcting the reflection) ---------- */

function wheelHtml(p, allowUnsure) {
  if (!p.core) {
    let html = '<p class="hint">Start with the closest broad feeling.</p><div class="grid2">';
    WHEEL.forEach((c,i) => { html += '<button class="core-btn" data-i="' + i + '" style="background:' + c.color + ';color:' + c.text + '">' + c.label + '</button>'; });
    html += '</div>';
    if (allowUnsure) html += '<button class="link-btn" data-w="unsure" style="margin-top:12px">Not sure yet — carry on without a word</button>';
    return html;
  }
  if (!p.middle) {
    let html = '<div class="crumbs"><button data-w="backCore">' + escapeHtml(p.core.label) + '</button><span>&rsaquo;</span><span>a bit more specific</span></div><div class="pillwrap">';
    Object.keys(p.core.middles).forEach(m => { html += '<button class="pill" data-m="' + escapeHtml(m) + '">' + escapeHtml(m) + '</button>'; });
    return html + '</div><button class="link-btn" data-w="good">Good enough — keep ' + escapeHtml(p.core.label) + '</button>';
  }
  let html = '<div class="crumbs"><button data-w="backCore">' + escapeHtml(p.core.label) + '</button><span>&rsaquo;</span>' +
    '<button data-w="backMid">' + escapeHtml(p.middle) + '</button><span>&rsaquo;</span><span>most precise</span></div><div class="pillwrap">';
  p.core.middles[p.middle].forEach(o => { html += '<button class="pill" data-o="' + escapeHtml(o) + '">' + escapeHtml(o) + '</button>'; });
  return html + '</div><button class="link-btn" data-w="good">Good enough — keep ' + escapeHtml(p.middle) + '</button>';
}

function bindWheel(el, p, onPick) {
  el.querySelectorAll(".core-btn").forEach(btn => { btn.onclick = () => { p.core = WHEEL[+btn.dataset.i]; render(); }; });
  el.querySelectorAll("[data-m]").forEach(btn => { btn.onclick = () => { p.middle = btn.dataset.m; render(); }; });
  el.querySelectorAll("[data-o]").forEach(btn => { btn.onclick = () => onPick(feelingFrom(p.core, p.middle, btn.dataset.o)); });
  el.querySelectorAll("[data-w]").forEach(btn => {
    const w = btn.dataset.w;
    btn.onclick = () => {
      if (w === "unsure") return onPick(feelingFrom(UNSURE, null, null));
      if (w === "good") return onPick(feelingFrom(p.core, p.middle, null));
      if (w === "backCore") { p.core = null; p.middle = null; }
      if (w === "backMid") { p.middle = null; }
      render();
    };
  });
}

/* ---------- check-in flow ---------- */

function stepHead() {
  let html = '<div class="steps">';
  for (let i = 0; i < 4; i++) html += '<span' + (i <= step ? ' class="on"' : '') + '></span>';
  return html + '</div><p class="step-kicker">' + (step + 1) + ' of 4 · ' + STEP_TITLES[step][0] + '</p>' +
    '<h2 class="step-title">' + STEP_TITLES[step][1] + '</h2>';
}

function chipsHtml(options, selected, group) {
  let html = '<div class="chipwrap">';
  options.forEach((o, i) => {
    const on = Array.isArray(selected) ? selected.includes(o.key || o) : selected === (o.key || o);
    html += '<button class="chip' + (on ? ' on' : '') + '" data-g="' + group + '" data-i="' + i + '" aria-pressed="' + on + '">' + escapeHtml(o.label || o) + '</button>';
  });
  return html + '</div>';
}

function navHtml(nextLabel) {
  return '<div class="nav-row">' + (step > 0 ? '<button class="btn-ghost" id="backBtn">Back</button>' : '<span></span>') +
    (nextLabel ? '<button class="btn-primary" id="nextBtn">' + nextLabel + '</button>' : '') + '</div>';
}

function bindNav(el, onNext) {
  const back = el.querySelector("#backBtn"), next = el.querySelector("#nextBtn");
  if (back) back.onclick = () => { step -= 1; render(); };
  if (next) next.onclick = onNext || (() => { step += 1; render(); });
}

function bindText(el, id, field) {
  const node = el.querySelector("#" + id);
  if (node) node.oninput = () => { draft[field] = node.value; };
}

function bindChips(el, group, options, field, multi) {
  el.querySelectorAll('.chip[data-g="' + group + '"]').forEach(btn => {
    btn.onclick = () => {
      const o = options[+btn.dataset.i], v = o.key || o;
      if (multi) draft[field] = draft[field].includes(v) ? draft[field].filter(x => x !== v) : draft[field].concat(v);
      else draft[field] = draft[field] === v ? (field === "after" ? null : "") : v;
      render();
    };
  });
}

function renderFlow(el) {
  let html = stepHead();

  if (step === 0) {
    html += '<textarea id="fWhat" placeholder="e.g. My manager changed the deadline in the team meeting">' + escapeHtml(draft.what) + '</textarea>' +
      '<label class="field-label">Who was there?</label>' + chipsHtml(WHO, draft.who, "who") +
      '<input type="text" class="chip-input" id="fWhoOther" placeholder="Someone else…" maxlength="40" value="' + escapeHtml(draft.whoOther) + '">' +
      '<label class="field-label">Where were you?</label>' + chipsHtml(WHERE, draft.where, "where") +
      '<input type="text" class="chip-input" id="fWhereOther" placeholder="Somewhere else…" maxlength="40" value="' + escapeHtml(draft.whereOther) + '">' +
      navHtml("Next");
    el.innerHTML = html;
    bindText(el, "fWhat", "what"); bindText(el, "fWhoOther", "whoOther"); bindText(el, "fWhereOther", "whereOther");
    bindChips(el, "who", WHO, "who", true); bindChips(el, "where", WHERE, "where", false);
    bindNav(el);
    return;
  }

  if (step === 1) {
    if (!draft.feeling) {
      html += wheelHtml(pick, true) + navHtml(null);
      el.innerHTML = html;
      bindWheel(el, pick, f => { draft.feeling = f; render(); });
      bindNav(el);
      return;
    }
    const f = draft.feeling;
    html += '<div class="chosen" style="background:' + f.color + ';color:' + f.textColor + '"><span>' + escapeHtml(pathLabel(f)) + '</span><button id="changeFeel">Change</button></div>';
    if (f.coreKey !== "unlabeled") {
      html += '<label class="field-label" for="fInt">How strong was it?</label>' +
        '<div class="intensity-row"><input type="range" id="fInt" min="1" max="10" step="1" value="' + draft.intensity + '">' +
        '<span class="intensity-val" id="fIntVal">' + draft.intensity + '/10</span></div>' +
        '<div class="intensity-ends"><span>barely there</span><span>overwhelming</span></div>';
    }
    html += navHtml("Next");
    el.innerHTML = html;
    el.querySelector("#changeFeel").onclick = () => { draft.feeling = null; pick = { core: null, middle: null }; render(); };
    const r = el.querySelector("#fInt");
    if (r) r.oninput = () => { draft.intensity = +r.value; el.querySelector("#fIntVal").textContent = r.value + "/10"; };
    bindNav(el);
    return;
  }

  if (step === 2) {
    html += '<textarea id="fDid" placeholder="e.g. Went quiet and left the meeting early">' + escapeHtml(draft.did) + '</textarea>' +
      '<label class="field-label">Closest fit (optional — helps spot patterns)</label>' + chipsHtml(DID, draft.didTags, "did") +
      navHtml("Next");
    el.innerHTML = html;
    bindText(el, "fDid", "did"); bindChips(el, "did", DID, "didTags", true);
    bindNav(el);
    return;
  }

  html += '<textarea id="fNext" placeholder="e.g. Nobody followed up, and I stayed late to catch up">' + escapeHtml(draft.next) + '</textarea>' +
    '<label class="field-label">And how did you feel afterwards?</label>' + chipsHtml(AFTER, draft.after, "after") +
    navHtml("Save");
  el.innerHTML = html;
  bindText(el, "fNext", "next"); bindChips(el, "after", AFTER, "after", false);
  bindNav(el, saveEntry);
}

function renderCheckin() {
  const el = document.getElementById("bodyEl");
  const e = phase === "flow" ? null : currentEntry();
  if (phase !== "flow" && !e) { phase = "flow"; }

  if (phase === "flow") { renderFlow(el); return; }

  if (phase === "reflect") {
    el.innerHTML = '<div class="reflect"><p class="step-kicker">' + (retried ? 'Let me try that again' : 'Saved · here’s what I heard') + '</p>' +
      '<p class="reflect-quote">' + reflectionHtml(e) + '</p>' +
      '<p class="reflect-ask">Does that fit?</p><div class="reflect-btns">' +
      '<button class="btn-primary" id="fitsBtn">Yes, that fits</button>' +
      '<button class="btn-ghost" id="notQuiteBtn">Not quite — change the feeling</button></div></div>';
    el.querySelector("#fitsBtn").onclick = () => { e.reflection = Object.assign({ corrections: 0, first: null }, e.reflection, { fits: true }); persist(); phase = "done"; render(); };
    el.querySelector("#notQuiteBtn").onclick = () => { phase = "correct"; pick = { core: null, middle: null }; render(); };
    return;
  }

  if (phase === "correct") {
    el.innerHTML = '<p class="step-kicker">Not quite</p><h2 class="step-title">Which word fits better?</h2>' + wheelHtml(pick, false) +
      '<div class="nav-row"><button class="btn-ghost" id="keepBtn">Keep “' + escapeHtml(feelWord(e) || "not sure") + '”</button><span></span></div>';
    bindWheel(el, pick, f => {
      const r = Object.assign({ fits: null, corrections: 0, first: null }, e.reflection);
      if (!r.first) r.first = pathLabel(e);
      r.corrections += 1; r.fits = null;
      Object.assign(e, f, { reflection: r });
      if (!e.intensity) e.intensity = null;
      persist(); phase = "reflect"; retried = true; pick = { core: null, middle: null }; render();
    });
    el.querySelector("#keepBtn").onclick = () => { phase = "reflect"; render(); };
    return;
  }

  el.innerHTML =
    '<div class="saved"><div class="checkmark" style="background:' + e.color + ';color:' + e.textColor + '">&#10003;</div>' +
    '<p class="small">Logged</p><p class="path">' + escapeHtml(pathLabel(e)) + '</p>' +
    '<button class="again-btn" id="againBtn">Add another</button></div>';
  document.getElementById("againBtn").onclick = () => { phase = "flow"; currentId = null; render(); };
}

/* ---------- history ---------- */

function abcCardHtml(e) {
  const a = e.antecedent || {}, b = e.behaviour || {}, c = e.consequence || {};
  const aMeta = [(a.who || []).join(", "), a.where].filter(Boolean).join(" · ");
  const confirm = pendingDelete === e.id;
  let html = '<div class="abc"><div class="abc-top"><span class="entry-time">' + fmtTime(e.date) + '</span>' +
    '<button class="del-btn' + (confirm ? ' confirm' : '') + '" data-id="' + escapeHtml(e.id) + '" aria-label="Delete entry">' + (confirm ? 'Delete?' : '&#10005;') + '</button></div>';
  if (a.what || aMeta) {
    html += '<div class="abc-row"><span class="abc-key" title="Antecedent">A</span><div class="abc-text">' + escapeHtml(a.what || "") +
      (aMeta ? '<div class="abc-meta">' + escapeHtml(aMeta) + '</div>' : '') + '</div></div>';
  }
  html += '<div class="abc-row"><span class="abc-key" title="Feeling"><span class="dot" style="background:' + e.color + '"></span></span><div class="abc-text">' +
    escapeHtml(pathLabel(e)) + (e.intensity ? ' <span class="abc-meta" style="display:inline">· ' + e.intensity + '/10</span>' : '') + '</div></div>';
  const bTags = (b.tags || []).join(", ");
  if (b.what || bTags) {
    html += '<div class="abc-row"><span class="abc-key" title="Behaviour">B</span><div class="abc-text">' + escapeHtml(b.what || "") +
      (bTags ? '<div class="abc-meta">' + escapeHtml(bTags) + '</div>' : '') + '</div></div>';
  }
  const after = AFTER.find(x => x.key === c.after);
  if (c.what || after) {
    html += '<div class="abc-row"><span class="abc-key" title="Consequence">C</span><div class="abc-text">' + escapeHtml(c.what || "") +
      (after ? '<div class="abc-meta"><span class="after-pill ' + after.key + '">Afterwards: ' + after.label.toLowerCase() + '</span></div>' : '') + '</div></div>';
  }
  return html + '</div>';
}

function exportText() {
  const stamp = iso => new Date(iso).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric" }) + ", " + fmtTime(iso);
  const lines = ["Feelings check-in \u2014 " + entries.length + (entries.length === 1 ? " entry" : " entries") + ", exported " + stamp(new Date().toISOString()), ""];
  entries.forEach(e => {
    const a = e.antecedent || {}, b = e.behaviour || {}, c = e.consequence || {}, r = e.reflection || {};
    const after = AFTER.find(x => x.key === c.after);
    lines.push(stamp(e.date));
    if (a.what) lines.push("Antecedent: " + a.what);
    if ((a.who || []).length) lines.push("Who: " + a.who.join(", "));
    if (a.where) lines.push("Where: " + a.where);
    lines.push("Feeling: " + pathLabel(e) + (e.intensity ? " (" + e.intensity + "/10)" : ""));
    if (r.first) lines.push("First chose: " + r.first + " (changed after reflection)");
    if (b.what || (b.tags || []).length) lines.push("Behaviour: " + [b.what, (b.tags || []).length ? "[" + b.tags.join(", ") + "]" : ""].filter(Boolean).join(" "));
    if (c.what) lines.push("Consequence: " + c.what);
    if (after) lines.push("Afterwards: " + after.label.toLowerCase());
    lines.push("");
  });
  return lines.join("\n").trim() + "\n";
}

function copyText(text) {
  const fallback = () => new Promise((resolve, reject) => {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
    document.body.removeChild(ta);
    ok ? resolve() : reject(new Error("copy failed"));
  });
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).catch(fallback);
  return fallback();
}

function renderHistory() {
  const el = document.getElementById("bodyEl");
  if (entries.length === 0) { el.innerHTML = '<p class="empty">No check-ins yet. Log your first one on the Check in tab.</p>'; return; }
  const prev = el.querySelector(".history-scroll");
  const scrollTop = prev ? prev.scrollTop : 0;

  const last30 = windowFilter(30);
  const counts = {}; WHEEL.forEach(c => counts[c.key] = 0);
  last30.forEach(e => { if (counts[e.coreKey] !== undefined) counts[e.coreKey] += 1; });
  const maxCount = Math.max(1, ...Object.values(counts));

  let html = '<div class="hist-head"><p class="day-label">Last 30 days</p><button class="copy-btn" id="copyAllBtn">Copy all ' + entries.length + (entries.length === 1 ? ' entry' : ' entries') + '</button></div><div class="bars">';
  WHEEL.forEach(c => {
    const h = counts[c.key] > 0 ? (counts[c.key] / maxCount) * 40 + 4 : 0;
    html += '<div class="bar-col" title="' + c.label + '"><div class="bar" style="height:' + h + 'px;background:' + c.color + '"></div><span class="bar-count">' + counts[c.key] + '</span></div>';
  });
  html += '</div><div class="history-scroll">';

  let lastKey = null;
  entries.forEach(e => {
    const key = dayKey(e.date);
    if (key !== lastKey) { html += '<p class="day-label" style="margin-top:14px">' + fmtDate(e.date) + '</p>'; lastKey = key; }
    html += abcCardHtml(e);
  });
  html += '</div>';
  el.innerHTML = html;
  el.querySelector(".history-scroll").scrollTop = scrollTop;
  const copyBtn = el.querySelector("#copyAllBtn");
  copyBtn.onclick = () => {
    const label = copyBtn.textContent;
    copyText(exportText()).then(() => { copyBtn.textContent = "Copied \u2713"; }, () => { copyBtn.textContent = "Couldn\u2019t copy"; })
      .then(() => { setTimeout(() => { copyBtn.textContent = label; }, 1800); });
  };
  el.querySelectorAll(".del-btn").forEach(btn => {
    btn.onclick = () => { if (pendingDelete === btn.dataset.id) deleteEntry(btn.dataset.id); else { pendingDelete = btn.dataset.id; render(); } };
  });
}

/* ---------- insights ---------- */

const STOPWORDS = new Set(("the and for that this with was were had has have are not but she her his him they them their there then than " +
  "when what who how why you your our out about into from just got get did didn does doesn don didnt dont its it's i'm i've too very really " +
  "again still been being some any all one two more most much many over under off onto after before while because said say says told tell " +
  "asked ask went going come came back down up again also only even ever never always can could would should will wasn't couldn't didn't don't " +
  "me my mine myself we us him he a an of to in on at is it as be by or so if no do am i").split(" "));

function groupBy(arr, getKeys) {
  const m = new Map();
  arr.forEach(e => { new Set(getKeys(e)).forEach(k => { if (!m.has(k)) m.set(k, []); m.get(k).push(e); }); });
  return Array.from(m.entries()).map(([label, list]) => ({ label, list })).filter(g => g.list.length >= 2)
    .sort((a,b) => b.list.length - a.list.length);
}

function feelingsAfterHtml(list) {
  const cores = topCounts(list, "coreLabel", 2);
  const ints = list.map(e => e.intensity).filter(Boolean);
  let s = cores.map(c => '<span class="dot" style="background:' + c.color + '"></span>' + escapeHtml(c.label) + ' ' + c.count).join(' &nbsp;·&nbsp; ');
  if (ints.length) s += ' &nbsp;·&nbsp; avg ' + (ints.reduce((a,b) => a+b, 0) / ints.length).toFixed(1) + '/10';
  return s;
}

function antecedentGroupHtml(title, groups) {
  if (groups.length === 0) return "";
  let html = '<p class="day-label" style="margin-top:12px">' + title + '</p>';
  groups.slice(0, 4).forEach(g => {
    html += '<div class="pat-row"><div class="pat-head"><span>' + escapeHtml(g.label) + '</span><span class="n">' + g.list.length + '×</span></div>' +
      '<div class="pat-sub">' + feelingsAfterHtml(g.list) + '</div></div>';
  });
  return html;
}

function patternsHtml(windowed) {
  const withA = windowed.filter(e => e.antecedent);
  const who = groupBy(withA, e => e.antecedent.who || []);
  const where = groupBy(withA, e => e.antecedent.where ? [e.antecedent.where] : []);
  const words = groupBy(withA, e => ((e.antecedent.what || "").toLowerCase().match(/[a-zà-ɏ']+/g) || [])
    .map(w => w.replace(/^'+|'+$/g, "")).filter(w => w.length >= 3 && !STOPWORDS.has(w)));

  let html = '<p class="section-title">What tends to come before</p><p class="section-note">Recurring antecedents, and the feelings that followed them.</p>';
  const aHtml = antecedentGroupHtml("Who was there", who) + antecedentGroupHtml("Where", where) + antecedentGroupHtml("Words that keep coming up", words);
  html += aHtml || '<p class="section-note">Nothing has repeated yet. Patterns show up once a situation appears in two or more check-ins.</p>';

  const withB = windowed.filter(e => e.behaviour && (e.behaviour.tags || []).length && e.consequence && e.consequence.after);
  const did = groupBy(withB, e => e.behaviour.tags);
  html += '<p class="section-title">What you did, and how it left you</p><p class="section-note">How you felt afterwards, by behaviour.</p>';
  if (did.length === 0) {
    html += '<p class="section-note">Nothing has repeated yet. Pick a “closest fit” for what you did and how you felt afterwards to build this up.</p>';
  }
  const colors = { better: "var(--good)", same: "var(--faint)", worse: "var(--danger)" };
  did.slice(0, 6).forEach(g => {
    const n = { better: 0, same: 0, worse: 0 };
    g.list.forEach(e => { if (n[e.consequence.after] !== undefined) n[e.consequence.after] += 1; });
    html += '<div class="pat-row"><div class="pat-head"><span>' + escapeHtml(g.label) + '</span><span class="n">' + g.list.length + '×</span></div><div class="stack">';
    ["better", "same", "worse"].forEach(k => { if (n[k]) html += '<div style="flex:' + n[k] + ';background:' + colors[k] + '"></div>'; });
    html += '</div><div class="pat-sub">' + ["better", "same", "worse"].filter(k => n[k]).map(k => n[k] + ' ' + k).join(' · ') + '</div></div>';
  });
  return html;
}

function renderInsights() {
  const el = document.getElementById("bodyEl");
  if (entries.length === 0) { el.innerHTML = '<p class="empty">No check-ins yet. Insights build up once you start logging.</p>'; return; }

  const windowed = windowFilter(windowDays);
  const longestStreak = computeLongestStreak();
  const streak = computeStreak();
  const precisionRate = windowed.length ? Math.round((windowed.filter(e => e.outer).length / windowed.length) * 100) : 0;

  let html = '<div class="stat-grid">';
  [["Check-ins", entries.length], ["Streak", streak], ["Best streak", longestStreak], ["To specifics", precisionRate + "%"]].forEach(([label, val]) => {
    html += '<div class="stat-card"><div class="stat-val">' + val + '</div><div class="stat-label">' + label + '</div></div>';
  });
  html += '</div><div class="win-row">';
  WINDOWS.forEach(w => { html += '<button class="win-btn' + (windowDays === w.days ? ' active' : '') + '" data-days="' + w.days + '">' + w.label + '</button>'; });
  html += '</div>';

  const counts = {}; WHEEL.forEach(c => counts[c.key] = 0);
  windowed.forEach(e => { if (counts[e.coreKey] !== undefined) counts[e.coreKey] += 1; });
  const total = windowed.length || 1;
  const dist = WHEEL.map(c => ({ ...c, count: counts[c.key], pct: Math.round((counts[c.key] / total) * 100) })).sort((a,b) => b.count - a.count);

  html += '<p class="day-label">How you’ve been feeling</p>';
  dist.forEach(c => {
    html += '<div class="dist-row"><span class="dist-label">' + c.label + '</span>' +
      '<div class="dist-track"><div class="dist-fill" style="width:' + c.pct + '%;background:' + c.color + '"></div></div>' +
      '<span class="dist-num">' + c.count + ' · ' + c.pct + '%</span></div>';
  });

  const topPath = mostCommonPath(windowed);
  if (topPath) {
    html += '<div class="highlight-card" style="margin-top:12px;margin-bottom:0"><p class="day-label" style="margin:0">Most named feeling</p>' +
      '<p style="font-size:14px;margin:4px 0 0">' + escapeHtml(topPath.label) + ' <span style="color:var(--faint)">· ' + topPath.count + '×</span></p></div>';
  }

  html += patternsHtml(windowed);

  const topMiddles = topCounts(windowed, "middle", 5);
  const topOuters = topCounts(windowed, "outer", 5);
  html += '<p class="section-title">Words you reach for</p><div class="two-col" style="margin-top:8px"><div><p class="day-label">Top mid-level</p>';
  if (topMiddles.length === 0) html += '<p style="font-size:12px;color:var(--faint)">None yet</p>';
  topMiddles.forEach(m => { html += '<div class="word-row"><span class="dot" style="background:' + m.color + '"></span><span>' + escapeHtml(m.label) + '</span><span>' + m.count + '</span></div>'; });
  html += '</div><div><p class="day-label">Top specific words</p>';
  if (topOuters.length === 0) html += '<p style="font-size:12px;color:var(--faint)">None yet</p>';
  topOuters.forEach(o => { html += '<div class="word-row"><span class="dot" style="background:' + o.color + '"></span><span>' + escapeHtml(o.label) + '</span><span>' + o.count + '</span></div>'; });
  html += '</div></div>';

  const now = Date.now();
  const thisWeek = entries.filter(e => now - new Date(e.date).getTime() < 7 * 86400000);
  const lastWeek = entries.filter(e => { const diff = now - new Date(e.date).getTime(); return diff >= 7*86400000 && diff < 14*86400000; });
  const countBy = (arr) => { const c = {}; WHEEL.forEach(w => c[w.key] = 0); arr.forEach(e => { if (c[e.coreKey] !== undefined) c[e.coreKey] += 1; }); return c; };
  const t = countBy(thisWeek), l = countBy(lastWeek);
  const wow = WHEEL.map(c => ({ ...c, tw: t[c.key], lw: l[c.key], delta: t[c.key] - l[c.key] })).filter(c => c.tw > 0 || c.lw > 0).sort((a,b) => b.tw - a.tw);
  if (wow.length > 0) {
    html += '<p class="day-label">This week vs last week</p>';
    wow.forEach(c => {
      const color = c.delta > 0 ? "#C2564B" : c.delta < 0 ? "#7FA084" : "var(--faint)";
      html += '<div class="wow-row"><span class="left"><span class="dot" style="background:' + c.color + '"></span>' + c.label + '</span>' +
        '<span style="color:var(--muted)">' + c.lw + ' &rarr; ' + c.tw + ' <span style="color:' + color + '">(' + (c.delta > 0 ? "+" : "") + c.delta + ')</span></span></div>';
    });
  }

  el.innerHTML = html;
  el.querySelectorAll(".win-btn").forEach(btn => {
    btn.onclick = () => { windowDays = btn.dataset.days === "null" ? null : Number(btn.dataset.days); render(); };
  });
}

function render() {
  renderHeader();
  document.getElementById("tabCheckin").classList.toggle("active", tab === "checkin");
  document.getElementById("tabHistory").classList.toggle("active", tab === "history");
  document.getElementById("tabInsights").classList.toggle("active", tab === "insights");
  if (tab === "checkin") renderCheckin();
  else if (tab === "history") renderHistory();
  else renderInsights();
  if (saveError) document.getElementById("bodyEl").insertAdjacentHTML("beforeend", '<p class="error">Could not save locally. Your browser storage may be full or blocked.</p>');
}

document.getElementById("tabCheckin").onclick = () => { tab = "checkin"; if (phase === "done") { phase = "flow"; currentId = null; } render(); };
document.getElementById("tabHistory").onclick = () => { tab = "history"; pendingDelete = null; render(); };
document.getElementById("tabInsights").onclick = () => { tab = "insights"; render(); };

render();
</script>
</body>
</html>
